# Render Blueprint — chạy THỬ Learning by AI trên Render (New + → Blueprint → chọn repo này).
# LƯU Ý: gói free có đĩa tạm thời → mỗi lần khởi động lại/triển khai lại/"ngủ" (sau 15 phút không có người dùng), thư mục dữ liệu bị xóa.
# Để KHÔNG mất dữ liệu: bật sao lưu tự động ra kho ngoài (Supabase Storage) bằng 2 biến LBAI_BACKUP_URL và LBAI_BACKUP_KEY bên dưới —
# ứng dụng tự đẩy bản sao vài phút một lần và tự khôi phục khi khởi động lại. Có thể mất vài phút dữ liệu gần nhất nếu bị tắt đột ngột.
# Muốn chắc chắn hơn: đổi plan sang trả phí, thêm khối `disk` (mountPath /var/data) và đặt LBAI_DATA=/var/data (xem render.production.yaml).
services:
  - type: web
    name: learning-by-ai
    runtime: python
    plan: free
    region: singapore            # gần Việt Nam nhất
    buildCommand: python --version   # ứng dụng chỉ dùng thư viện chuẩn của Python, không cần cài gói (kể cả AI Gemini; chỉ AI Claude tùy chọn mới cần `pip install -r requirements.txt`)
    startCommand: python -m server
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: LBAI_COOKIE_SECURE   # Render phục vụ HTTPS → cookie đăng nhập chỉ gửi qua HTTPS
        value: "1"
      - key: LBAI_TRUST_PROXY     # đứng sau proxy của Render: lấy IP thật từ X-Forwarded-For
        value: "1"
      - key: LBAI_NO_BROWSER
        value: "1"
      - key: LBAI_QUIET           # không ghi log từng yêu cầu (tránh lộ địa chỉ IP người dùng vào log)
        value: "1"
      - key: GEMINI_API_KEY       # khóa Google Gemini (BÍ MẬT, có gói miễn phí tại Google AI Studio) để bật AI giải đáp án khi import đề — bạn tự nhập trong bảng điều khiển Render, KHÔNG ghi vào file này; để trống = tắt tính năng AI
        sync: false
      - key: LBAI_SETUP_CODE      # mã bí mật để tạo tài khoản quản trị lần đầu — bạn tự nhập trong bảng điều khiển Render, KHÔNG ghi vào file này
        sync: false
      - key: LBAI_BACKUP_URL      # địa chỉ dự án Supabase, dạng https://xxxx.supabase.co — tự nhập trong bảng điều khiển Render
        sync: false
      - key: LBAI_BACKUP_KEY      # service key của dự án Supabase (BÍ MẬT) — tự nhập trong bảng điều khiển Render, KHÔNG ghi vào file này
        sync: false
      - key: LBAI_BACKUP_BUCKET
        value: lbai-backup
      - key: LBAI_BACKUP_INTERVAL # số giây giữa hai lần kiểm tra để sao lưu (chỉ đẩy khi có thay đổi)
        value: "300"
